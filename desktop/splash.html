<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Forget</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b0d10;color:#c9d1d9;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-app-region:drag}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.logo{background:#f2f4f7;color:#0b0d10;font-weight:800;font-size:44px;letter-spacing:.32em;padding:16px 20px 16px 36px;border-radius:10px;box-shadow:0 0 0 1px #2a2f36,0 18px 50px rgba(0,0,0,.6)}
.dots{display:flex;gap:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#e5484d;opacity:.25;animation:p 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.tip{height:20px;font-size:13px;color:#8b949e;text-align:center;padding:0 30px;transition:opacity .35s}
.tip.off{opacity:0}
</style></head><body>
<div class="logo">FORGET</div>
<div class="dots"><i></i><i></i><i></i></div>
<div class="tip" id="tip"></div>
<script>
const tips=["Purges keep running in the background","Your token is encrypted with Windows (DPAPI)","Everything stays on your computer","Export an archive before deleting","You can filter servers and channels by name"];
let i=0;const el=document.getElementById('tip');el.textContent=tips[0];
setInterval(()=>{el.classList.add('off');setTimeout(()=>{i=(i+1)%tips.length;el.textContent=tips[i];el.classList.remove('off')},350)},2800);
</script></body></html>

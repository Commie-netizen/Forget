name: Bug report
description: Report incorrect behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, message content, or databases. For security vulnerabilities, use private security advisories.
  - type: input
    id: version
    attributes:
      label: Forget version
      placeholder: "4.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      render: text

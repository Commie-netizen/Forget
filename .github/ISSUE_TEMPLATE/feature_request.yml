name: Demande de fonctionnalité
description: Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: Cette proposition ne nécessite ni télémétrie ni service tiers
          required: true

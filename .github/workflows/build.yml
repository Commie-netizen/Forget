name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # aucun jeton git laissé sur le disque du runner

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm --prefix server ci --no-audit --no-fund

      - name: Install web dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Tests
        run: npm run test:all

      - name: Build web
        run: npm run build

      - name: Build desktop
        run: npm run desktop:build

      - name: Publier l'exécutable portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forget-portable
          path: dist-desktop/Forget-*.exe
          if-no-files-found: error
